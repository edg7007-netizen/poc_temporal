spring:
  application:
    name: poc-temporal-lending-engine

  datasource:
    url: jdbc:h2:mem:lendingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

# Temporal configuration (using temporal-spring-boot-starter)
spring.temporal:
  connection:
    target: 127.0.0.1:7233
  workers:
    - task-queue: lending-task-queue
      workflow-classes:
        - com.poc.temporal.lending.workflow.TermLoanWorkflowImpl
        - com.poc.temporal.lending.workflow.BulletLoanWorkflowImpl
      activity-beans:
        - loanActivitiesImpl
        - ledgerActivitiesImpl

server:
  port: 8080

logging:
  level:
    com.poc.temporal: DEBUG
    io.temporal: INFO

spring:
  application:
    name: poc-temporal-lending-engine

  # Datasource is auto-configured by Spring Boot Docker Compose support at startup.
  # When running locally, `compose.yaml` (at the project root) is started automatically
  # and the connection URL, username, and password are injected from the running container.

  jpa:
    hibernate:
      # create-drop is intentional for this PoC: schema is recreated fresh on every start.
      # For a production environment, switch to 'validate' or 'none' and use a migration tool (e.g. Flyway).
      ddl-auto: create-drop
    # Ensures data.sql runs AFTER Hibernate has created the schema
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

# Temporal configuration (using temporal-spring-boot-starter)
spring.temporal:
  connection:
    target: 127.0.0.1:7233
  workers:
    - task-queue: lending-task-queue
      workflow-classes:
        - com.poc.temporal.lending.workflow.TermLoanWorkflowImpl
        - com.poc.temporal.lending.workflow.BulletLoanWorkflowImpl
      activity-beans:
        - loanActivitiesImpl
        - ledgerActivitiesImpl

server:
  port: 8080

logging:
  level:
    com.poc.temporal: DEBUG
    io.temporal: INFO
